<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Campus Lost & Found</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
<style>
:root{--bg:#f3f1ea;--ink:#1d2b2a;--mute:#64726f;--card:#fff;--line:#d9d6c9;--teal:#0f5c58;--tag:#f2b632;--lost:#c2410c;--found:#0f766e;--r:10px}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 Georgia,'Times New Roman',serif;background:var(--bg);color:var(--ink)}
h1,h2,h3,button,input,select,textarea,.nav a,.pill{font-family:system-ui,-apple-system,Segoe UI,sans-serif}
header{background:var(--teal);color:#fff;display:flex;align-items:center;gap:14px;padding:10px 20px;flex-wrap:wrap;position:sticky;top:0;z-index:5}
header h1{font-size:18px;margin:0;margin-right:auto}.nav{display:flex;gap:4px;flex-wrap:wrap}
.nav a{color:#d6ebe8;padding:6px 12px;border-radius:20px;cursor:pointer;font-size:14px}.nav a.on,.nav a:hover{background:#fff;color:var(--teal)}
main{max-width:1000px;margin:0 auto;padding:20px}
button,.btn{background:var(--teal);color:#fff;border:0;border-radius:8px;padding:8px 14px;cursor:pointer;font-size:14px}
button.alt{background:#fff;color:var(--ink);border:1px solid var(--line)}button.warn{background:#b91c1c}button.tag{background:var(--tag);color:#1d2b2a}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--tag);outline-offset:1px}
input,select,textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:14px}
label{display:block;font:600 13px system-ui;margin:10px 0 3px}
.bar{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:8px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:pointer;border-left:6px solid var(--lost)}
.card.found{border-left-color:var(--found)}.card .im{height:130px;background:#e8e5d8;display:grid;place-items:center;color:var(--mute);font:13px system-ui}
.card .im img{width:100%;height:100%;object-fit:cover}.card .b{padding:10px 12px}.card h3{margin:0 0 4px;font-size:16px}
.meta{color:var(--mute);font-size:13px}.pill{display:inline-block;font-size:12px;padding:1px 9px;border-radius:12px;background:#e8e5d8;margin-right:4px}
.pill.lost{background:#fde4d6;color:var(--lost)}.pill.found{background:#d3f1ec;color:var(--found)}.pill.verified{background:#dbeafe;color:#1e40af}.pill.recovered{background:#dcfce7;color:#166534}.pill.removed{background:#fee2e2;color:#991b1b}
.hero{background:var(--teal);color:#fff;border-radius:var(--r);padding:22px;margin-bottom:18px}.hero .meta{color:#cfe6e3}.hero h2{margin:0 0 4px}.hero input{max-width:420px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;max-width:520px;margin:auto}
.modal{position:fixed;inset:0;background:#0007;display:grid;place-items:center;padding:16px;z-index:10}
.modal .panel{max-height:90vh;overflow:auto;width:100%;max-width:560px}
.modal img{max-width:100%;border-radius:8px}
table{width:100%;border-collapse:collapse;background:#fff;font:13px system-ui}td,th{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}.stat{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:10px 16px}.stat b{font-size:22px;display:block}
#toasts{position:fixed;right:14px;bottom:14px;display:grid;gap:8px;z-index:20}.toast{background:var(--ink);color:#fff;padding:10px 14px;border-radius:8px;font:14px system-ui;max-width:300px;border-left:5px solid var(--tag)}
.bell{position:relative}.bell span{position:absolute;top:-4px;right:-4px;background:var(--tag);color:#000;font:700 11px system-ui;border-radius:10px;padding:0 5px}
.pager{display:flex;gap:10px;justify-content:center;align-items:center;margin:16px 0}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.note{padding:10px;border-bottom:1px solid var(--line);font-size:14px}.note.un{background:#fff8e1}
@media(max-width:640px){.bar{grid-template-columns:1fr 1fr}}
</style></head><body>
<header><h1>Campus Lost &amp; Found</h1><nav class="nav" id="nav"></nav><span id="who"></span></header>
<main id="app"></main><div id="toasts"></div><div id="modal"></div>
<script>
const API = localStorage.getItem('lf_api') || 'http://localhost:5000'; // change if your backend runs elsewhere
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let token = localStorage.getItem('lf_token'), user = null, socket = null, view = 'home', meta = {categories:[],types:[],statuses:[]};
let q = {q:'',type:'',category:'',status:'',location:'',from:'',to:'',sort:'',page:1}, adminTab = 'reports';
const CATS = ['id_card','phone','wallet','books','calculator','bag','other'];
const label = s => String(s||'').replace('_',' ').replace(/^./, c=>c.toUpperCase());

async function api(path, {method='GET', body, form} = {}) {
  const h = token ? {Authorization:'Bearer '+token} : {};
  let opts = {method, headers:h};
  if (form) opts.body = form; else if (body) { h['Content-Type']='application/json'; opts.body = JSON.stringify(body); }
  let r; try { r = await fetch(API+path, opts); } catch { throw new Error('Cannot reach server at '+API); }
  const d = await r.json().catch(()=>({}));
  if (r.status === 401 && token) { logout(); }
  if (!r.ok) throw new Error(d.message || d.error || 'Request failed ('+r.status+')');
  return d;
}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;$('#toasts').append(t);setTimeout(()=>t.remove(),5000)}
const img = i => i.image ? (/^http/.test(i.image) ? i.image : API+'/'+i.image.replace(/^\/+/,'').replace(/\\/g,'/')) : '';
const fmt = d => d ? new Date(d).toLocaleDateString() : '';
const itemsOf = d => d.items || d.reports || d.data || (Array.isArray(d)?d:[]);

/* ---------- auth & socket ---------- */
function logout(){token=null;user=null;localStorage.removeItem('lf_token');socket&&socket.disconnect();socket=null;view='login';render()}
function connect(){
  if(socket) socket.disconnect();
  socket = io(API, {auth:{token}});
  socket.on('newItem', i => { toast(`New ${i.type||''} item: ${i.title||''}`); refreshIfList(); });
  socket.on('itemRecovered', i => { toast(`Recovered: ${i.title||'an item'}`); refreshIfList(); });
  socket.on('itemStatusChanged', i => { toast(`${i.title||'Item'} is now ${i.status||'updated'}`); refreshIfList(); });
  socket.on('itemRemoved', () => refreshIfList());
  socket.on('adminNewReport', i => { if(user?.role==='admin') toast('Needs verification: '+(i.title||'new report')); refreshIfList(); });
  socket.on('notification', n => { toast(n.message||n.title||'New notification'); loadBell(); });
}
const refreshIfList = () => { if(['home','search','mine','admin'].includes(view) && !$('#modal').innerHTML) render(); };
async function loadBell(){ if(!token) return; try{const d=await api('/api/notifications');window._unread=d.unreadCount||0;window._notes=d.notifications||[];drawNav()}catch{} }

function drawNav(){
  const tabs = !user ? [['login','Log in'],['register','Register']] : [['home','Home'],['search','Search'],['lost','Report lost'],['found','Report found'],['mine','My reports'],['recovered','Recovered']];
  if (user?.role==='admin') tabs.push(['admin','Admin']);
  $('#nav').innerHTML = tabs.map(([k,t])=>`<a data-v="${k}" class="${view===k?'on':''}" tabindex="0">${t}</a>`).join('') +
    (user?`<a data-v="notes" class="bell ${view==='notes'?'on':''}" tabindex="0">Alerts${window._unread?`<span>${window._unread}</span>`:''}</a><a data-v="profile" tabindex="0">Profile</a>`:'');
  $('#who').innerHTML = user ? `<button class="alt" id="out">Log out</button>` : '';
  $('#nav').querySelectorAll('a').forEach(a=>{a.onclick=()=>{view=a.dataset.v;render()};a.onkeydown=e=>e.key==='Enter'&&a.click()});
  const o=$('#out'); if(o) o.onclick=logout;
}

/* ---------- views ---------- */
async function render(){
  drawNav(); const app=$('#app');
  if(!user){ return authView(view==='register'?'register':'login'); }
  try{
    if(view==='home') await homeView();
    else if(view==='search'||view==='recovered') await listView();
    else if(view==='lost'||view==='found') reportView(view);
    else if(view==='mine') await mineView();
    else if(view==='notes') await notesView();
    else if(view==='profile') profileView();
    else if(view==='admin') await adminView();
  }catch(e){ app.innerHTML=`<div class="panel">${esc(e.message)}</div>`; }
}

function authView(mode='login'){
  $('#app').innerHTML=`<div class="panel"><h2>${mode==='login'?'Log in':'Create account'}</h2><form id="f">
  ${mode==='register'?`<label>Name</label><input name="name" required><label>Roll number</label><input name="rollNumber"><label>Phone</label><input name="phone">`:''}
  <label>Email</label><input name="email" type="email" required><label>Password</label><input name="password" type="password" required minlength="6">
  <div class="row"><button>${mode==='login'?'Log in':'Register'}</button><button type="button" class="alt" id="sw">${mode==='login'?'Create an account':'I have an account'}</button></div></form>
  <p class="meta">Server: ${esc(API)}</p></div>`;
  $('#sw').onclick=()=>{view=mode==='login'?'register':'login';render()};
  $('#f').onsubmit=async e=>{e.preventDefault();const b=Object.fromEntries(new FormData(e.target));
    try{
      const d=await api('/api/auth/'+mode,{method:'POST',body:b});
      token=d.token||d.accessToken||d.data?.token;
      if(!token) throw new Error('Server did not return a token. Response: '+JSON.stringify(d).slice(0,150));
      localStorage.setItem('lf_token',token);
      user=d.user||d.data?.user||null;
      if(!user){const m=await api('/api/auth/me');user=m.user||m.data||m}
      view='home';connect();loadBell();render();
    }catch(x){token=null;localStorage.removeItem('lf_token');toast(x.message)}}
}

function card(i){return `<div class="card ${i.type}" data-id="${i._id}" tabindex="0"><div class="im">${img(i)?`<img src="${esc(img(i))}" alt="" loading="lazy">`:'No photo'}</div>
<div class="b"><h3>${esc(i.title)}</h3><span class="pill ${i.type}">${i.type}</span><span class="pill ${i.status}">${i.status}</span><span class="pill">${label(i.category)}</span>
<div class="meta">${esc(i.location)} · ${fmt(i.date)}</div></div></div>`}
function bindCards(){document.querySelectorAll('.card').forEach(c=>{c.onclick=()=>detail(c.dataset.id);c.onkeydown=e=>e.key==='Enter'&&c.click()})}

async function listView(){
  const rec = view==='recovered';
  try{meta=await api('/api/search/meta')}catch{}
  const cats = meta.categories?.length?meta.categories:CATS;
  const p = new URLSearchParams(); Object.entries(q).forEach(([k,v])=>v&&!(rec&&['status'].includes(k))&&p.set(k,v)); p.set('limit',12);
  const d = await api(rec?`/api/search/recovered?${p}`:`/api/search?${p}`);
  const sel=(n,opts,all)=>`<select name="${n}" aria-label="${all}"><option value="">${all}</option>${opts.map(o=>`<option value="${o}" ${q[n]===o?'selected':''}>${label(o)}</option>`).join('')}</select>`;
  $('#app').innerHTML=`<h2>${rec?'Recovered items':'Search lost &amp; found items'}</h2><form class="bar" id="bar"><input name="q" placeholder="Search title, description, location" value="${esc(q.q)}">
  ${sel('type',['lost','found'],'Lost &amp; found')}${sel('category',cats,'All categories')}${rec?'<span></span>':sel('status',['pending','verified','recovered'],'Any status')}
  <input name="location" placeholder="Location (e.g. library)" value="${esc(q.location)}" aria-label="Location"><input name="from" type="date" value="${q.from}" aria-label="From date" title="From date"><input name="to" type="date" value="${q.to}" aria-label="To date" title="To date">
  <select name="sort" aria-label="Sort"><option value="">Sort: default</option><option value="-createdAt" ${q.sort==='-createdAt'?'selected':''}>Newest first</option><option value="createdAt" ${q.sort==='createdAt'?'selected':''}>Oldest first</option></select></form>
  <div class="row" style="margin:-6px 0 12px"><button type="button" class="alt" id="clr">Clear filters</button></div>
  <div class="grid">${itemsOf(d).map(card).join('')||'<p class="meta">No items match. Try fewer filters, or report the item yourself.</p>'}</div>
  <div class="pager"><button class="alt" id="pv" ${d.page<=1?'disabled':''}>Previous</button><span class="meta">Page ${d.page||1} of ${d.pages||1} (${d.total||0} items)</span><button class="alt" id="nx" ${d.page>=d.pages?'disabled':''}>Next</button></div>`;
  bindCards();
  const bar=$('#bar'); let t;
  bar.oninput=e=>{window._f=e.target.name;clearTimeout(t);t=setTimeout(()=>{q={...q,...Object.fromEntries(new FormData(bar)),page:1};render()},['q','location'].includes(e.target.name)?400:0)};
  bar.onsubmit=e=>e.preventDefault();
  $('#pv').onclick=()=>{q.page--;render()};$('#nx').onclick=()=>{q.page++;render()};
  $('#clr').onclick=()=>{q={q:'',type:'',category:'',status:'',location:'',from:'',to:'',sort:'',page:1};window._f=null;render()};
  if(window._f){const f=bar[window._f];if(f){f.focus();try{f.setSelectionRange(f.value.length,f.value.length)}catch{}}}
}

async function homeView(){
  const d=await api('/api/search?limit=6'); const l=itemsOf(d);
  $('#app').innerHTML=`<section class="hero"><h2>Hi ${esc(user.name)}, lost something on campus?</h2><p class="meta">Report it, or see what others have found.</p>
  <div class="row"><button class="tag" data-go="lost">I lost something</button><button data-go="found">I found something</button></div>
  <form id="hq" class="row"><input name="q" placeholder="Search e.g. blue wallet, ID card" style="flex:1;min-width:200px"><button>Search</button></form></section>
  <div class="stats"><div class="stat"><b>${d.total||0}</b>Items listed</div><div class="stat"><b>${window._unread||0}</b>Unread alerts</div></div>
  <h3>Latest reports</h3><div class="grid">${l.map(card).join('')||'<p class="meta">Nothing reported yet. Be the first to post.</p>'}</div>
  <div class="row"><button class="alt" data-go="search">Browse all items</button></div>`;
  bindCards();
  document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{view=b.dataset.go;render()});
  $('#hq').onsubmit=e=>{e.preventDefault();q.q=e.target.q.value;q.page=1;view='search';render()};
}

function reportView(type){
  $('#app').innerHTML=`<div class="panel"><h2>Report ${type} item</h2><form id="f"><label>Title</label><input name="title" required placeholder="e.g. Black Casio calculator">
  <label>Category</label><select name="category">${CATS.map(c=>`<option value="${c}">${label(c)}</option>`).join('')}</select>
  <label>Description</label><textarea name="description" rows="3" required></textarea><label>${type==='lost'?'Where you lost it':'Where you found it'}</label><input name="location" required>
  <label>Date</label><input name="date" type="date" required value="${new Date().toISOString().slice(0,10)}"><label>How to contact you</label><input name="contactInfo" required value="${esc(user.phone||user.email||'')}">
  <label>Photo (optional)</label><input name="image" type="file" accept="image/*"><div class="row"><button class="tag">Submit report</button></div></form></div>`;
  $('#f').onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.target);if(!fd.get('image').size)fd.delete('image');
    try{await api('/api/items/'+type,{method:'POST',form:fd});toast('Report submitted. An admin will verify it.');view='mine';render()}catch(x){toast(x.message)}}
}

async function mineView(){
  const d=await api('/api/items/my'); const l=itemsOf(d);
  $('#app').innerHTML=`<h2>My reports</h2><div class="grid">${l.map(card).join('')||'<p class="meta">You have not reported anything yet.</p>'}</div>`;bindCards();
}

async function detail(id){
  let i; try{const d=await api('/api/items/'+id); i=d.item||d}catch(e){return toast(e.message)}
  const ownerId=i.reportedBy?._id||i.reportedBy||i.user?._id||i.user, mine=ownerId===user._id||ownerId===user.id, admin=user.role==='admin';
  $('#modal').innerHTML=`<div class="modal"><div class="panel">${img(i)?`<img src="${esc(img(i))}" alt="">`:''}<h2>${esc(i.title)}</h2>
  <span class="pill ${i.type}">${i.type}</span><span class="pill ${i.status}">${i.status}</span><span class="pill">${label(i.category)}</span>
  <p>${esc(i.description)}</p><p class="meta">Location: ${esc(i.location)}<br>Date: ${fmt(i.date)}<br>Contact: <b>${esc(i.contactInfo)}</b>${i.reportedBy?.name?`<br>Reported by ${esc(i.reportedBy.name)}`:''}</p>
  <div class="row">${(mine||admin)&&i.status!=='recovered'?'<button id="rec" class="tag">Mark as recovered</button>':''}${mine?'<button id="del" class="warn">Delete report</button>':''}<button id="x" class="alt">Close</button></div></div></div>`;
  $('#x').onclick=()=>{$('#modal').innerHTML=''};
  const r=$('#rec'); if(r) r.onclick=async()=>{try{await api(`/api/items/${id}/recovered`,{method:'PATCH'});toast('Marked as recovered');$('#modal').innerHTML='';render()}catch(e){toast(e.message)}};
  const dl=$('#del'); if(dl) dl.onclick=async()=>{if(!confirm('Delete this report?'))return;try{await api('/api/items/'+id,{method:'DELETE'});$('#modal').innerHTML='';render()}catch(e){toast(e.message)}};
}

async function notesView(){
  const d=await api('/api/notifications'); window._unread=d.unreadCount||0; drawNav(); const l=d.notifications||[];
  $('#app').innerHTML=`<h2>Alerts</h2><div class="row"><button class="alt" id="all">Mark all read</button></div><div class="panel" style="max-width:none;margin-top:12px;padding:0">${l.map(n=>`<div class="note ${n.read?'':'un'}" data-id="${n._id}">${esc(n.message||n.title)}<div class="meta">${fmt(n.createdAt)}</div></div>`).join('')||'<div class="note">No alerts yet. You will be notified about possible matches and report updates.</div>'}</div>`;
  $('#all').onclick=async()=>{await api('/api/notifications/read-all',{method:'PATCH'});notesView()};
  document.querySelectorAll('.note.un').forEach(n=>n.onclick=async()=>{await api(`/api/notifications/${n.dataset.id}/read`,{method:'PATCH'});notesView()});
}

function profileView(){
  $('#app').innerHTML=`<div class="panel"><h2>Profile</h2><form id="f"><label>Name</label><input name="name" value="${esc(user.name)}"><label>Roll number</label><input name="rollNumber" value="${esc(user.rollNumber)}">
  <label>Phone</label><input name="phone" value="${esc(user.phone)}"><label>Current password (only to change password)</label><input name="currentPassword" type="password"><label>New password</label><input name="newPassword" type="password">
  <div class="row"><button>Save changes</button></div></form></div>`;
  $('#f').onsubmit=async e=>{e.preventDefault();const b=Object.fromEntries(new FormData(e.target));Object.keys(b).forEach(k=>!b[k]&&delete b[k]);
    try{const d=await api('/api/auth/me',{method:'PUT',body:b});user=d.user||d;toast('Profile saved')}catch(x){toast(x.message)}}
}

async function adminView(){
  const s=await api('/api/admin/stats'), tabs=['reports','users'];
  const flat=Object.entries(s).flatMap(([k,v])=>typeof v==='object'&&v?Object.entries(v).map(([a,b])=>[a,b]):[[k,v]]);
  let body='';
  if(adminTab==='reports'){
    const d=await api('/api/admin/reports?limit=50'); const l=itemsOf(d);
    body=`<div style="overflow-x:auto"><table><tr><th>Item</th><th>Type</th><th>Status</th><th>Reporter</th><th>Actions</th></tr>${l.map(i=>`<tr><td><a href="#" data-open="${i._id}">${esc(i.title)}</a><div class="meta">${esc(i.location)}</div></td><td>${i.type}</td><td><select data-st="${i._id}">${['pending','verified','recovered','removed'].map(x=>`<option ${x===i.status?'selected':''}>${x}</option>`).join('')}</select></td><td>${esc(i.reportedBy?.name||'')}</td>
    <td>${i.status==='pending'?`<button data-v="${i._id}">Verify</button> `:''}<button class="warn" data-rm="${i._id}">Remove</button></td></tr>`).join('')}</table></div>`;
  } else {
    const d=await api('/api/admin/users'); const l=d.users||d;
    body=`<table><tr><th>Name</th><th>Email</th><th>Roll</th><th>Role</th></tr>${l.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.email)}</td><td>${esc(u.rollNumber)}</td><td>${u.role}</td></tr>`).join('')}</table>`;
  }
  $('#app').innerHTML=`<h2>Admin</h2><div class="stats">${flat.map(([k,v])=>`<div class="stat"><b>${esc(v)}</b>${esc(label(k))}</div>`).join('')}</div>
  <div class="row" style="margin:0 0 12px">${tabs.map(t=>`<button class="${t===adminTab?'':'alt'}" data-tab="${t}">${label(t)}</button>`).join('')}</div>${body}`;
  document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{adminTab=b.dataset.tab;render()});
  document.querySelectorAll('[data-open]').forEach(a=>a.onclick=e=>{e.preventDefault();detail(a.dataset.open)});
  document.querySelectorAll('[data-v]').forEach(b=>b.onclick=async()=>{try{await api(`/api/admin/reports/${b.dataset.v}/verify`,{method:'PATCH'});toast('Verified');render()}catch(e){toast(e.message)}});
  document.querySelectorAll('[data-st]').forEach(s=>s.onchange=async()=>{try{await api(`/api/admin/reports/${s.dataset.st}/status`,{method:'PATCH',body:{status:s.value}});toast('Status updated');render()}catch(e){toast(e.message)}});
  document.querySelectorAll('[data-rm]').forEach(b=>b.onclick=async()=>{const reason=prompt('Reason for removing this report (shown to the reporter):');if(reason===null)return;
    const hard=confirm('Delete permanently? OK = permanent, Cancel = soft remove');
    try{await api(`/api/admin/reports/${b.dataset.rm}${hard?'?hard=true':''}`,{method:'DELETE',body:{reason}});toast('Report removed');render()}catch(e){toast(e.message)}});
}

/* ---------- boot ---------- */
(async()=>{
  if(token==='undefined'||token==='null') token=null;
  if(token){try{const d=await api('/api/auth/me');user=d.user||d.data||d;connect();loadBell();view='home'}catch(e){token=null;localStorage.removeItem('lf_token');toast(e.message)}}
  render();
})();
</script></body></html>
